---
# Smoke tests that fail loudly. Run with `make verify` after `make apply`.
# --check-mode caveat: some checks only make sense after a real apply.
- name: Verify g3plus
  hosts: g3plus
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted secrets into the secrets fact
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', 'secrets.sops.yaml') | from_yaml }}"
      tags: [always]
    - name: Announce what is silently skipped (missing secrets)
      ansible.builtin.debug:
        msg: >-
          SKIPPED (missing secret): hermes[hermes_openrouter_api_key],
          tunnel[cloudflare_tunnel_token],
          dns-records+real-certs[cloudflare_api_token],
          drive-backup[rclone_drive_token],
          jellyfin-wizard[jellyfin_admin_password],
          disk-check-timer[uptime_kuma_disk_push_token],
          kuma-backup-push[uptime_kuma_backup_push_token],
          kuma-telegram[telegram_bot_token_uptime_kuma],
          hermes-telegram[hermes_telegram_bot_token],
          vpn[vpn_provider];
          current: see `make secrets-check`.
      tags: [always]
  tasks:
    - name: SSH key login works (proven implicitly by this playbook connecting)
      ansible.builtin.debug:
        msg: connected as {{ ansible_user }} with the SSH key

    - name: User groups include docker, render and video
      ansible.builtin.command: id -nG sumit
      changed_when: false
      register: user_groups
    - name: Assert groups
      ansible.builtin.assert:
        that:
          - "'docker' in user_groups.stdout.split()"
          - "'render' in user_groups.stdout.split()"
          - "'video' in user_groups.stdout.split()"
        fail_msg: "sumit is missing from docker/render/video; fix and reconnect SSH to pick up new groups."

    - name: Docker is running and enabled on boot
      ansible.builtin.systemd:
        name: docker
      check_mode: true
      register: docker_service
    - name: Assert Docker state
      ansible.builtin.assert:
        that:
          - docker_service.status.ActiveState == 'active'
          - "'enabled' in docker_service.status.UnitFileState"
        fail_msg: "Docker is not active+enabled: {{ docker_service.status.ActiveState }}"

    - name: Docker daemon log rotation is configured
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_conf
    - name: Assert daemon.json
      vars:
        daemon_json: "{{ docker_conf.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - daemon_json['log-driver'] == 'json-file'
          - daemon_json['log-opts']['max-size'] == '10m'
          - daemon_json['log-opts']['max-file'] == '3'
        fail_msg: "/etc/docker/daemon.json differs: {{ daemon_json }}"

    - name: IP nonlocal-bind sysctl is on (containers survive early boot)
      ansible.builtin.command: sysctl -n net.ipv4.ip_nonlocal_bind
      changed_when: false
      register: nonlocal_bind
    - name: Assert sysctl
      ansible.builtin.assert:
        that: nonlocal_bind.stdout == '1'
        fail_msg: >-
          net.ipv4.ip_nonlocal_bind is {{ nonlocal_bind.stdout }},
          containers may fail to start at boot.

    - name: Tailscale is logged in, online and has the expected IP
      ansible.builtin.command: tailscale status --json
      changed_when: false
      register: ts
    - name: Assert Tailscale state
      vars:
        ts_json: "{{ ts.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - ts_json.BackendState == 'Running'
          - ts_json.Self.Online
          - ts_json.Self.TailscaleIPs[0] == tailscale_ip
        fail_msg: >-
          Tailscale problem: state={{ ts_json.BackendState }}
          online={{ ts_json.Self.Online }} ips={{ ts_json.Self.TailscaleIPs }}

    - name: Effective sshd config (from sshd -T, not just the drop-in file)
      ansible.builtin.command: sshd -T
      changed_when: false
      register: sshd_t
    - name: Assert SSH hardening is effective
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_t.stdout"
          - "'kbdinteractiveauthentication no' in sshd_t.stdout"
          - "'permitrootlogin no' in sshd_t.stdout"
          - "'pubkeyauthentication yes' in sshd_t.stdout"
        fail_msg: "Effective sshd config not hardened: {{ sshd_t.stdout }}"

    - name: UFW is active
      ansible.builtin.command: ufw status
      changed_when: false
      register: ufw_status
    - name: Assert UFW
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
          - "'192.168.0.0/24' in ufw_status.stdout"
          - "'tailscale0' in ufw_status.stdout"
        fail_msg: "UFW not active or rules missing: {{ ufw_status.stdout }}"

    - name: Unattended-upgrades reboot settings are effective
      ansible.builtin.command: apt-config dump Unattended-Upgrade::Automatic-Reboot
      changed_when: false
      register: apt_reboot
    - name: Assert auto-reboot
      ansible.builtin.assert:
        that:
          - "'true' in apt_reboot.stdout"
        fail_msg: "Automatic-Reboot is not set: {{ apt_reboot.stdout }}"

    - name: Chrony keeps the clock synced
      ansible.builtin.command: timedatectl show -p NTPSynchronized
      changed_when: false
      register: ntp
    - name: Assert time sync
      ansible.builtin.assert:
        that: ntp.stdout == 'NTPSynchronized=yes'
        fail_msg: "Clock not synced: {{ ntp.stdout }}"

    - name: Smartd is active
      ansible.builtin.systemd:
        name: smartd
      check_mode: true
      register: smartd_state
    - name: Assert smartd
      ansible.builtin.assert:
        that: smartd_state.status.ActiveState == 'active'
        fail_msg: "smartd is not active"

    - name: Weekly image-prune timer is enabled
      ansible.builtin.systemd:
        name: docker-prune.timer
      check_mode: true
      register: prune_timer
    - name: Assert prune timer
      ansible.builtin.assert:
        that:
          - prune_timer.status.ActiveState == 'active'
          - "'enabled' in prune_timer.status.UnitFileState"
        fail_msg: "docker-prune.timer not enabled"

    - name: Root filesystem usage below threshold
      ansible.builtin.command: df --output=pcent /
      changed_when: false
      register: disk
    - name: Assert disk usage
      vars:
        pct: "{{ disk.stdout_lines[-1] | regex_replace('[^0-9]', '') | int }}"
      ansible.builtin.assert:
        that: pct < disk_alert_pct
        fail_msg: "Disk usage {{ pct }}% is at/above the {{ disk_alert_pct }}% alert threshold."

    # Media stack
    - name: All media containers are running
      ansible.builtin.command: docker ps --format "{{ '{{.Names}} {{.Status}}' }}"
      changed_when: false
      register: containers
    - name: Assert media containers
      vars:
        expected: [qbittorrent, sonarr, radarr, prowlarr, bazarr, jellyseerr, flaresolverr, jellyfin]
        running: "{{ containers.stdout_lines | map('regex_replace', ' .*', '') | list }}"
      ansible.builtin.assert:
        that: expected | difference(running) | length == 0
        fail_msg: >-
          Missing containers: {{ expected | difference(running) }}.
          docker ps: {{ containers.stdout }}

    - name: List the swarm task containers
      # Swarm tasks report restart policy "no" on purpose: the swarm manager
      # reconciles them, and an engine-level policy would fight it. Their
      # recovery is asserted separately below, via the service replica counts.
      ansible.builtin.command: docker ps -a --filter label=com.docker.swarm.service.id --format {{ '{{.Names}}' }}
      changed_when: false
      register: swarm_tasks

    - name: Every standalone container has a restart policy
      # Anything without one stays down after a reboot.
      ansible.builtin.command: docker ps -a --format {{ '{{.Names}}' }}
      changed_when: false
      register: all_containers
    - name: Assert restart policies
      ansible.builtin.command: "docker inspect -f {{ '{{.HostConfig.RestartPolicy.Name}}' }} {{ item }}"
      changed_when: false
      loop: "{{ all_containers.stdout_lines | difference(swarm_tasks.stdout_lines | default([])) }}"
      register: restart_policies
    - name: Assert each policy
      ansible.builtin.assert:
        that:
          - item.stdout != 'no'
        fail_msg: "Container {{ item.item }} has restart policy '{{ item.stdout }}'; expected unless-stopped/always."
      loop: "{{ restart_policies.results }}"
      loop_control: { label: "{{ item.item }}" }

    - name: Jellyfin can see the GPU render device
      ansible.builtin.command: docker exec jellyfin test -c /dev/dri/renderD128
      changed_when: false
    - name: Report Quick Sync check command
      ansible.builtin.debug:
        msg: "Confirm active hardware transcoding live with: ssh g3plus intel_gpu_top (while a stream transcodes)"

    # Proxy + dashboards. HTTPS checks use the Tailscale IP like a real
    # client would; real Let's Encrypt certs validate cleanly once the
    # Cloudflare token is set (until then DNS-01 records do not exist).
    - name: Proxy and dashboard containers are running
      vars:
        expected: [caddy, homepage, dockge, uptime-kuma]
        running: "{{ containers.stdout_lines | map('regex_replace', ' .*', '') | list }}"
      ansible.builtin.assert:
        that: expected | difference(running) | length == 0
        fail_msg: >-
          Missing containers: {{ expected | difference(running) }}.
          docker ps: {{ containers.stdout }}
      when: not ansible_check_mode

    - name: Key endpoints answer over HTTPS on the Tailscale IP
      # Only meaningful once the Cloudflare token exists (DNS records + real
      # certificates). Before that, use the IP:443 curl in the README.
      vars:
        # 'hosts' is a reserved word in Ansible; endpoint_hosts is not.
        suffix: ".{{ private_host_suffix }}"
      ansible.builtin.uri:
        url: "https://{{ item }}{{ suffix }}/"
        # Real certificates validate once the token is set; before that the
        # internal CA would fail the check, so disable validation then.
        validate_certs: "{{ (secrets['cloudflare_api_token'] | default('')) | length > 0 }}"
        status_code: [200, 301, 302, 401, 404]
      loop: "{{ private_services | map(attribute='name') | list }}"
      register: endpoint_check
      failed_when: endpoint_check.status not in [200, 301, 302, 401, 404]
      changed_when: false
      when:
        - not ansible_check_mode
        - secrets['cloudflare_api_token'] | default('') | length > 0

    # VPN egress check (when enabled). Verifies that gluetun's external IP
    # differs from the server's LAN IP, confirming traffic leaves via the
    # VPN tunnel rather than the direct ISP path.
    - name: VPN egress IP is reachable
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - gluetun
          - curl
          - -s
          - --max-time
          - 10
          - https://ifconfig.me
      register: gluetun_ip
      changed_when: false
      when: vpn_enabled | bool
    - name: VPN egress IP is not the LAN IP
      ansible.builtin.assert:
        that: gluetun_ip.stdout != '192.168.0.2'
        fail_msg: "VPN egress IP matches the LAN IP; VPN may not be working"
      when: vpn_enabled | bool

    # Docker-published ports bypass UFW (dockerd DNATs them in PREROUTING,
    # before UFW's INPUT chains), so the DOCKER-USER chain is their only
    # guard. The security role installs the rule and the boot unit that
    # re-applies it; assert both stay in place.
    - name: The DOCKER-USER rules gate port 3000 on physical interfaces
      # noqa: risky-shell-pipe
      # Dokploy's admin UI is published host-mode by the swarm and therefore
      # invisible to UFW. The rule must drop only traffic arriving on a
      # physical interface (otherwise it eats forwarded container traffic,
      # which is what broke Caddy -> Homepage:3000).
      ansible.builtin.shell: |
        ok=1
        for t in iptables ip6tables; do
          $t -S DOCKER-USER | grep -qE -- "-i (enp|wl)[a-z0-9]+ .*--dport 3000 .*DROP" || ok=0
        done
        [ $ok -eq 1 ]
      changed_when: false
      register: port3000_rule
      failed_when: port3000_rule.rc != 0
    - name: The old overbroad rule is gone
      ansible.builtin.command:
        argv: [iptables, -C, DOCKER-USER, -p, tcp, --dport, "3000", "!", -i, tailscale0, -j, DROP]
      changed_when: false
      failed_when: false
      register: port3000_old_rule
    - name: Assert the old overbroad rule is removed
      ansible.builtin.assert:
        that: port3000_old_rule.rc != 0
        fail_msg: >-
          The old DOCKER-USER rule (dport 3000, deny-all-but-tailscale0)
          is back; it breaks Caddy reaching Homepage on :3000. Run the
          docker-user-rules.sh script.
    - name: The rule is re-applied on boot
      ansible.builtin.systemd:
        name: docker-user-rules.service
      check_mode: true
      register: docker_user_rules_unit
    - name: Assert the boot unit is enabled
      ansible.builtin.assert:
        that: "'enabled' in docker_user_rules_unit.status.UnitFileState"
        fail_msg: docker-user-rules.service is not enabled; port 3000 reopens on the next reboot.

    - name: Nothing holds wildcard 80 or 443
      # Caddy binds 443 on the LAN and Tailscale IPs only, and nothing
      # listens on 80 at all. A wildcard bind means dokploy-traefik (or
      # anything else) took the port back and would serve the whole LAN.
      ansible.builtin.command: ss -H -tln
      changed_when: false
      register: host_listeners
    - name: Assert 80/443 are never wildcard-bound
      vars:
        offending: >-
          {{ host_listeners.stdout_lines
             | select('search', '(0\.0\.0\.0|\[::\]|\*):(80|443)\s')
             | list }}
      ansible.builtin.assert:
        that: offending | length == 0
        fail_msg: "Wildcard 80/443 listener found: {{ offending | join(' | ') }}"

    # Dokploy (PaaS), gated on the same toggle as the role.
    - name: Dokploy's Traefik publishes no host ports
      # The installer's traefik binds 80/443 on every interface, conflicting
      # with Caddy and bypassing the private-only model. The role recreates
      # it without ports on every apply; same detection string as that task.
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - dokploy-traefik
          - --format
          - "{{ '{{json .HostConfig.PortBindings}}' }}"
      changed_when: false
      failed_when: false
      register: dokploy_traefik_ports
      when: dokploy_enabled | bool
    - name: Assert Dokploy's 80/443 stay closed
      ansible.builtin.assert:
        that:
          - dokploy_traefik_ports.rc == 0
          - "'\"HostPort\":\"80\"' not in dokploy_traefik_ports.stdout"
          - "'\"HostPort\":\"443\"' not in dokploy_traefik_ports.stdout"
        fail_msg: >-
          dokploy-traefik is missing or publishes host ports again:
          rc={{ dokploy_traefik_ports.rc }} {{ dokploy_traefik_ports.stdout }}
      when: dokploy_enabled | bool

    - name: The Dokploy swarm services exist
      # argv (not a string command): the Go template contains a space.
      ansible.builtin.command:
        argv: [docker, service, ls, --format, "{{ '{{.Name}} {{.Replicas}}' }}"]
      changed_when: false
      register: swarm_services
      when: dokploy_enabled | bool
    - name: Assert the services exist
      vars:
        expected: [dokploy, dokploy-postgres]
        running: "{{ swarm_services.stdout_lines | map('regex_replace', ' .*', '') | list }}"
      ansible.builtin.assert:
        that: expected | difference(running) | length == 0
        fail_msg: >-
          Missing swarm services: {{ expected | difference(running) }};
          swarm has {{ running }}
      when: dokploy_enabled | bool
    - name: Assert every swarm service runs its full replica count
      # "dokploy 1/1" passes, "dokploy 0/1" fails. Swarm reconciles its own
      # containers (engine restart policy is "no" for them by design), so
      # full replicas - plus the reboot acceptance tests - are their story.
      # No backreference regex: assert's that-mangling turns \1 into a
      # control char; compare the split halves instead.
      vars:
        replicas: "{{ item.split()[1] | default('') }}"
      ansible.builtin.assert:
        that:
          - item is match('^\S+ \d+/\d+\s*$')
          - replicas.split('/')[0] == replicas.split('/')[1]
        fail_msg: "Swarm service not at full replicas: {{ item }}"
      loop: "{{ swarm_services.stdout_lines | default([]) }}"
      loop_control: { label: "{{ item.split()[0] }}" }
      when: dokploy_enabled | bool

    # Backups (the role is gated on the restic password in the secrets)
    - name: Backup timers are active and enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
      check_mode: true
      loop: [backup.timer, backup-maintenance.timer]
      register: backup_timers
      when: secrets['restic_repository_password'] | default('') | length > 0
    - name: Assert backup timers
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == 'active'
          - "'enabled' in item.status.UnitFileState"
        fail_msg: "{{ item.item }} is not active+enabled"
      loop: "{{ backup_timers.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: backup_timers is not skipped

    - name: The restic repo exists and holds snapshots
      ansible.builtin.command:
        argv:
          - restic
          - -r
          - "{{ backup_root }}/restic"
          - --password-file
          - /etc/restic.pass
          - snapshots
          - --json
      changed_when: false
      register: restic_snapshots
      when: secrets['restic_repository_password'] | default('') | length > 0
    - name: Assert snapshots exist
      ansible.builtin.assert:
        that: restic_snapshots.stdout | from_json | length > 0
        fail_msg: >-
          No snapshots in {{ backup_root }}/restic;
          seed it with: ssh g3plus sudo systemctl start backup.service
      when: restic_snapshots is not skipped

    - name: The restic repo passes an integrity check
      ansible.builtin.command:
        argv:
          - restic
          - -r
          - "{{ backup_root }}/restic"
          - --password-file
          - /etc/restic.pass
          - check
      changed_when: false
      register: restic_check
      failed_when: false
      when: secrets['restic_repository_password'] | default('') | length > 0
    - name: Assert the repo check passed
      ansible.builtin.assert:
        that: restic_check.rc == 0
        fail_msg: "restic check failed: {{ restic_check.stderr }}"
      when: restic_check is not skipped

    - name: The Dokploy postgres dump is seeded
      ansible.builtin.stat:
        path: "{{ backup_root }}/dumps/dokploy-postgres.sql.gz"
      register: pg_dump_file
      when: dokploy_enabled | bool
    - name: Assert the dump is seeded
      ansible.builtin.assert:
        that: pg_dump_file.stat.exists and pg_dump_file.stat.size > 0
        fail_msg: "No postgres dump at {{ backup_root }}/dumps; run backup.service"
      when: pg_dump_file is not skipped

    # Recyclarr (uses the repo's pre-seeded keys; no user secret needed).
    - name: Recyclarr timer is active and enabled
      ansible.builtin.systemd:
        name: recyclarr.timer
      check_mode: true
      register: recyclarr_timer
    - name: Assert Recyclarr timer
      ansible.builtin.assert:
        that:
          - recyclarr_timer.status.ActiveState == 'active'
          - "'enabled' in recyclarr_timer.status.UnitFileState"
        fail_msg: "recyclarr.timer is not active+enabled"

    - name: Recyclarr synced the TRaSH profiles
      # Ports are the media stack's fixed internal ports (see media defaults).
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.port }}/api/v3/qualityprofile"
        headers: { X-Api-Key: "{{ secrets[item.key] | default('') }}" }
        return_content: true
      loop:
        - { port: "8989", key: internal_sonarr_api_key, profile: WEB-1080p }
        - { port: "7878", key: internal_radarr_api_key, profile: HD Bluray + WEB }
      register: recyclarr_profiles
      changed_when: false
      failed_when: false
      when: secrets[item.key] | default('') | length > 0
    - name: Assert the TRaSH profiles exist
      ansible.builtin.assert:
        that: item.item.profile in (item.json | map(attribute='name') | list)
        fail_msg: "Recyclarr profile {{ item.item.profile }} missing; run the recyclarr.service."
      loop: "{{ recyclarr_profiles.results | default([]) }}"
      loop_control: { label: "{{ item.item.profile | default('skipped') }}" }
      when: item is not skipped

    - name: Report stacks not deployed because their secret is empty
      # Secretless mode is a supported state: these are WARNs, never FAILs.
      ansible.builtin.debug:
        msg: "WARN NOT DEPLOYED (missing secret {{ item.key }}): {{ item.role }}"
      loop:
        - { role: hermes, key: hermes_openrouter_api_key }
        - { role: tunnel, key: cloudflare_tunnel_token }
        - { role: DNS-records+real-certs, key: cloudflare_api_token }
        - { role: drive-backup, key: rclone_drive_token }
        - { role: jellyfin-auto-wizard, key: jellyfin_admin_password }
        - { role: disk-usage-check.timer, key: uptime_kuma_disk_push_token }
        - { role: kuma-backup-push, key: uptime_kuma_backup_push_token }
        - { role: kuma-telegram, key: telegram_bot_token_uptime_kuma }
        - { role: vpn, key: vpn_provider }
      when: secrets[item.key] | default('') | length == 0
      loop_control: { label: "{{ item.role }}" }

    # Secrets/state agreement: when a secret IS present, the matching
    # deployment must exist (otherwise apply silently dropped it).
    - name: Agreement - hermes secret present means the container exists
      ansible.builtin.command:
        argv: [docker, inspect, hermes]
      changed_when: false
      failed_when: false
      register: hermes_present
      when: secrets['hermes_openrouter_api_key'] | default('') | length > 0
    - name: Assert hermes agreement
      ansible.builtin.assert:
        that: hermes_present.rc == 0
        fail_msg: "hermes_openrouter_api_key is set but no hermes container; run make apply."
      when: hermes_present is not skipped

    - name: Agreement - tunnel secret present means cloudflared exists
      ansible.builtin.command:
        argv: [docker, inspect, cloudflared]
      changed_when: false
      failed_when: false
      register: tunnel_present
      when: secrets['cloudflare_tunnel_token'] | default('') | length > 0
    - name: Assert tunnel agreement
      ansible.builtin.assert:
        that: tunnel_present.rc == 0
        fail_msg: "cloudflare_tunnel_token is set but no cloudflared container; run make apply."
      when: tunnel_present is not skipped

    - name: Agreement - drive token present means rclone.conf exists
      ansible.builtin.stat:
        path: /etc/rclone/rclone.conf
      register: rclone_conf
      when: secrets['rclone_drive_token'] | default('') | length > 0
    - name: Assert rclone agreement
      ansible.builtin.assert:
        that: rclone_conf.stat.exists
        fail_msg: "/etc/rclone/rclone.conf missing although rclone_drive_token is set; run make apply."
      when: rclone_conf is not skipped

    - name: Agreement - kuma disk token present means the timer runs
      ansible.builtin.systemd:
        name: disk-usage-check.timer
      check_mode: true
      register: disk_timer
      when: secrets['uptime_kuma_disk_push_token'] | default('') | length > 0
    - name: Assert disk timer agreement
      ansible.builtin.assert:
        that:
          - disk_timer.status.ActiveState == 'active'
          - "'enabled' in disk_timer.status.UnitFileState"
        fail_msg: "disk-usage-check.timer not running although its token is set; run make apply."
      when: disk_timer is not skipped

    # No listener outside the allow-list: anything not enumerated here fails.
    - name: Collect all listening sockets with their processes
      ansible.builtin.shell: ss -H -tlnp; ss -H -ulnp
      changed_when: false
      register: all_listeners
    - name: Assert nothing listens outside the allow-list
      # Loopback-bound compose ports are all fine (README: 127.0.0.1-only);
      # everything else must be named in scripts/check-listeners.py.
      ansible.builtin.script:
        cmd: ../scripts/check-listeners.py {{ tailscale_ip }} {{ lan_ip }}
      changed_when: false
      register: listeners_check
      failed_when: listeners_check.rc != 0

    # UFW rules match the repo's expected list (drift from manual edits fails).
    - name: Collect the UFW ruleset
      ansible.builtin.command: ufw status numbered
      changed_when: false
      register: ufw_ruleset
    - name: Assert the UFW ruleset matches the repo
      vars:
        expected: ['22/tcp', '2377/tcp', '7946/tcp', '7946/udp', '4789/udp', 'tailscale0', '443/tcp']
        ufw_text: "{{ ufw_ruleset.stdout }}"
      ansible.builtin.assert:
        that: expected | reject('in', ufw_text) | list | length == 0
        fail_msg: "UFW ruleset drifted from the repo: {{ ufw_ruleset.stdout }}"
    - name: Assert the Swarm deny rules precede the tailscale0 accept
      vars:
        lines: "{{ ufw_ruleset.stdout_lines }}"
      ansible.builtin.assert:
        that:
          - lines | select('search', '2377/tcp.*DENY') | list | length > 0
          - lines | select('search', '4789/udp.*DENY') | list | length > 0
        fail_msg: "Swarm control-port DENY rules missing or reordered: {{ ufw_ruleset.stdout }}"

    # IPv6 side is gated the same way as IPv4.
    - name: Assert the v6 DOCKER-USER chain mirrors the v4 gating
      ansible.builtin.command:
        argv: [ip6tables, -S, DOCKER-USER]
      changed_when: false
      register: ip6_docker_user
    - name: Assert v6 port-3000 gating exists
      ansible.builtin.assert:
        that: "'--dport 3000' in ip6_docker_user.stdout"
        fail_msg: "ip6tables DOCKER-USER has no port-3000 gate; Dokploy UI may be reachable over v6."

    # Homepage must load behind Caddy (the --resolve stands in for the
    # *.home.sumitkpandit.in DNS records that do not exist in secretless mode).
    - name: Homepage answers 200 behind Caddy
      ansible.builtin.command:
        argv:
          - curl
          - -s
          - -k
          - --resolve
          - "homepage.{{ private_host_suffix }}:443:{{ lan_ip }}"
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - "https://homepage.{{ private_host_suffix }}/"
      changed_when: false
      register: homepage_code
    - name: Assert Homepage is reachable
      ansible.builtin.assert:
        that: homepage_code.stdout == '200'
        fail_msg: "Homepage is not 200 behind Caddy: {{ homepage_code.stdout }}"

    # Caddy's certificate issuer matches the deployment mode: internal CA in
    # secretless mode, Let's Encrypt once cloudflare_api_token is set.
    - name: Read the served certificate issuer
      # noqa: risky-shell-pipe (s_client output is piped to x509 by design)
      ansible.builtin.shell: >-
        echo | openssl s_client -connect {{ lan_ip }}:443
        -servername homepage.{{ private_host_suffix }} 2>/dev/null
        | openssl x509 -noout -issuer
      changed_when: false
      register: cert_issuer
    - name: Assert the issuer matches secretless/secreted mode
      # Secretless: the internal CA. Secreted: any public CA (whichever ACME
      # server Caddy negotiates), just not the internal one.
      vars:
        internal_mode: "{{ secrets['cloudflare_api_token'] | default('') | length == 0 }}"
        issuer: "{{ cert_issuer.stdout }}"
      ansible.builtin.assert:
        that:
          - (internal_mode and 'Caddy Local Authority' in issuer) or (not internal_mode)
          - internal_mode or ('Caddy Local Authority' not in issuer)
        fail_msg: "Certificate issuer {{ cert_issuer.stdout }} does not match mode (secretless: {{ internal_mode }})"

    # Swarm ports are closed to the outside (UFW denies; the swarm itself
    # still listens, which is expected for dockerd).
    - name: Assert the Swarm ports are denied in UFW
      ansible.builtin.assert:
        that:
          - "'2377/tcp' in ufw_ruleset.stdout"
          - "'7946/tcp' in ufw_ruleset.stdout"
          - "'4789/udp' in ufw_ruleset.stdout"
        fail_msg: "Swarm control ports are not denied in UFW: {{ ufw_ruleset.stdout }}"

    # DNS + tunnel checks only run when the token exists (BLOCKED-BY-SECRET).
    - name: The private DNS records resolve to the Tailscale IP
      ansible.builtin.command:
        argv: [getent, hosts, "{{ item.name }}.{{ private_host_suffix }}"]
      changed_when: false
      failed_when: false
      loop: "{{ private_services }}"
      register: dns_records
      when: secrets['cloudflare_api_token'] | default('') | length > 0
    - name: Assert the DNS records all point at the tailnet
      vars:
        resolved: "{{ dns_records.results | selectattr('stdout', 'defined') | map(attribute='stdout') | list }}"
      ansible.builtin.assert:
        that: resolved | select('search', tailscale_ip) | list | length == dns_records.results | length
        fail_msg: "A private DNS record does not resolve to {{ tailscale_ip }}: {{ dns_records }}"
      when: dns_records is not skipped

    - name: The cloudflared connector is up when its token exists
      ansible.builtin.command:
        argv: [docker, inspect, cloudflared, --format, "{{ '{{.State.Status}}' }}"]
      changed_when: false
      register: cloudflared_state
      when: secrets['cloudflare_tunnel_token'] | default('') | length > 0
    - name: Assert cloudflared is running
      ansible.builtin.assert:
        that: cloudflared_state.stdout == 'running'
        fail_msg: "cloudflared is not running: {{ cloudflared_state.stdout | default('missing') }}"
      when: cloudflared_state is not skipped

    # Jellyfin hardware acceleration (only meaningful once the admin exists).
    - name: Jellyfin reports Quick Sync hardware acceleration
      ansible.builtin.command:
        argv: [docker, exec, jellyfin, cat, /config/encoding.xml]
      changed_when: false
      failed_when: false
      register: jellyfin_encoding
      when: secrets['jellyfin_admin_password'] | default('') | length > 0
    - name: Assert Jellyfin QSV
      ansible.builtin.assert:
        that: "'<HardwareAccelerationType>qsv</HardwareAccelerationType>' in jellyfin_encoding.stdout"
        fail_msg: "Jellyfin is not on Quick Sync: {{ jellyfin_encoding.stdout[:200] | default('unreadable') }}"
      when: jellyfin_encoding is not skipped
