---
# Template for ansible/secrets.sops.yaml (the real file is SOPS+age encrypted).
# External secrets: fill the empty ones with `make secrets-edit`.
# internal_* keys: generated by `make secrets-init`; no action needed.

# Tailscale (only needed for a fresh server, first login)
tailscale_auth_key: ""

# Cloudflare: API token with Zone:DNS:Edit + Zone:Zone:Read on sumitkpandit.in only,
# and the token of the remotely-managed tunnel you create in the CF dashboard.
cloudflare_api_token: ""
cloudflare_tunnel_token: ""

# Telegram: bot token for Uptime Kuma notifications + your numeric chat ID.
# Both are used in the Kuma UI by hand (manual checklist in the README);
# only the chat ID is also rendered into files by Ansible (kuma-push.env,
# hermes env). telegram_bot_token_uptime_kuma itself never leaves this file
# until you paste it into Uptime Kuma's notification settings.
telegram_bot_token_uptime_kuma: ""
telegram_chat_id: ""

# Uptime Kuma push monitor tokens (create push monitors, paste tokens here)
uptime_kuma_disk_push_token: ""
uptime_kuma_backup_push_token: ""

# Hermes agent (OpenRouter key: create a dedicated one with a credit limit!)
hermes_openrouter_api_key: ""
hermes_telegram_bot_token: ""
hermes_dashboard_password: ""

# Jellyfin admin account (filled in by the first-run automation; set the
# password before `make apply` if you want the wizard automated)
jellyfin_admin_username: "sumit"
jellyfin_admin_password: ""

# Gluetun VPN (required only when vpn_enabled: true in group_vars/all.yml)
vpn_provider: ""
vpn_username: ""
vpn_password: ""

# Backups: restic repository password (auto-generated by secrets-init; keep an
# offline copy like the age key) and the rclone Google Drive token
# (single-line JSON blob - see README for how to produce it)
restic_repository_password: ""
rclone_drive_token: ""

# Internal API keys (generated; used to wire the media apps together).
# internal_bazarr_api_key is seeded into Bazarr on fresh installs only;
# internal_jellyseerr_api_key is reserved for later (Jellyseerr API keys are
# created in its UI after /setup completes, so no role consumes it yet).
internal_sonarr_api_key: ""
internal_radarr_api_key: ""
internal_prowlarr_api_key: ""
internal_bazarr_api_key: ""
internal_jellyseerr_api_key: ""
internal_qbittorrent_admin_password: ""
