---
# One-time disk formatting for the NAS role. DESTRUCTIVE: wipes every listed
# disk. Must be run explicitly and never from a scheduled role:
#   make nas-format   (prompts for nas_format_confirm=yes)
#
# Required input (group_vars or -e): the same nas_data_disks/nas_parity_disks
# entries plus `device_id` (the /dev/disk/by-id/ name, so the wrong spindle
# can never be addressed) on each:

- name: Format NAS disks
  hosts: g3plus
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load encrypted secrets into the secrets fact
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', 'secrets.sops.yaml') | from_yaml }}"
      tags: [always]
  tasks:
    - name: Require explicit format confirmation
      ansible.builtin.assert:
        that: nas_format_confirm | default('') | bool
        fail_msg: >-
          Refusing to format without -e nas_format_confirm=yes
          (make nas-format prompts for it).

    - name: Assert the drive lists are filled
      ansible.builtin.assert:
        that:
          - nas_data_disks | length > 0
          - nas_parity_disks | length > 0
        fail_msg: "Fill nas_data_disks/nas_parity_disks before formatting."

    - name: Assert every entry names a device_id
      ansible.builtin.assert:
        that: item.device_id is defined and item.device_id | length > 0
        fail_msg: "NAS drive entry is missing device_id: {{ item }}"
      loop: "{{ nas_data_disks + nas_parity_disks }}"

    - name: Refuse never-touch drives
      ansible.builtin.assert:
        that: >-
          nas_never_touch
          | select('in', (item.device_id | default('')) + ' ' + (item.label | default('')))
          | list | length == 0
        fail_msg: "Refusing to format a never-touch drive: {{ item }}"
      loop: "{{ nas_data_disks + nas_parity_disks }}"

    - name: Check each device exists before touching it
      ansible.builtin.stat:
        path: "/dev/disk/by-id/{{ item.device_id }}"
      loop: "{{ nas_data_disks + nas_parity_disks }}"
      register: format_devices

    - name: Abort when a listed device is absent
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Listed device is absent: /dev/disk/by-id/{{ item.item.device_id }}"
      loop: "{{ format_devices.results }}"

    - name: Show what is about to be wiped (last chance)
      ansible.builtin.debug:
        msg: "WIPING /dev/disk/by-id/{{ item.device_id }} as ext4, label {{ item.label }}"

      loop: "{{ nas_data_disks + nas_parity_disks }}"

    - name: Format each disk as ext4
      community.general.filesystem:
        fstype: ext4
        dev: "/dev/disk/by-id/{{ item.device_id }}"
        opts: "-L {{ item.label }}"
        force: true
      loop: "{{ nas_data_disks + nas_parity_disks }}"
