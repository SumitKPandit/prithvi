---
- name: Configure g3plus
  hosts: g3plus
  become: true
  # Secrets are decrypted on the Mac (SOPS lookup) and only rendered results
  # (0600 env files) ever reach the server.
  pre_tasks:
    # "always": without it, any --tags run would skip this untagged task,
    # leaving `secrets` undefined (silently empty via the default() filters).
    - name: Load encrypted secrets into the secrets fact
      ansible.builtin.set_fact:
        secrets: "{{ lookup('community.sops.sops', 'secrets.sops.yaml') | from_yaml }}"
      tags: [always]
    - name: Announce what is silently skipped (missing secrets)
      ansible.builtin.debug:
        msg: >-
          SKIPPED (missing secret): hermes[hermes_openrouter_api_key],
          tunnel[cloudflare_tunnel_token],
          dns-records+real-certs[cloudflare_api_token],
          drive-backup[rclone_drive_token],
          jellyfin-wizard[jellyfin_admin_password],
          disk-check-timer[uptime_kuma_disk_push_token],
          kuma-backup-push[uptime_kuma_backup_push_token],
          kuma-telegram[telegram_bot_token_uptime_kuma],
          hermes-telegram[hermes_telegram_bot_token],
          vpn[vpn_provider];
          current: see `make secrets-check`.
      tags: [always]
  roles:
    - { role: base, tags: [base] }
    - { role: docker, tags: [docker] }
    - { role: tailscale, tags: [tailscale] }
    - { role: security, tags: [security, ssh, ufw, updates, monitoring] }
    - { role: storage, tags: [storage] }
    - role: nas
      tags: [nas]
      # Disabled by default; see README "Phase 6: NAS". The role asserts its
      # own inputs before doing anything.
      when: nas_enabled | bool
    - { role: media, tags: [media] }
    - { role: proxy, tags: [proxy, caddy, dns] }
    - { role: dashboard, tags: [dashboard] }
    # Secret-gated stacks: these deploy once the matching key is in the secrets.
    - role: hermes
      tags: [hermes]
      when: secrets['hermes_openrouter_api_key'] | default('') | length > 0
    - role: dokploy
      tags: [dokploy]
      when: dokploy_enabled | bool
    - role: tunnel
      tags: [tunnel]
      when: secrets['cloudflare_tunnel_token'] | default('') | length > 0
    # Backups deploy once the restic repository password exists in the
    # secrets (auto-generated by secrets-init; the password was already
    # written into the encrypted file when this role landed).
    - role: backup
      tags: [backup]
      when: secrets['restic_repository_password'] | default('') | length > 0
