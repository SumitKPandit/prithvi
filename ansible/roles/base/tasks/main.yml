---
- name: Allow passwordless sudo for the admin user
  ansible.builtin.copy:
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/90-{{ ansible_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install admin tools
  ansible.builtin.apt:
    name: [tmux, lm-sensors, smartmontools, nvme-cli, vainfo, intel-gpu-tools, htop]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add user to GPU groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [video, render]
    append: true

- name: Install ca-certificates
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install python3-debian (needed by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Install python3-docker (needed by the Ansible docker modules)
  ansible.builtin.apt:
    name: python3-docker
    state: present
