---
# Remove the base role.
# Idempotent: running twice is a no-op. This is the LAST step in teardown.
# Removes: sudoers file, admin tool packages, GPU groups, apt keyring dir.
# Does NOT remove the sumit user or the ansible_user.

- name: Remove the passwordless sudo file
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-{{ ansible_user }}"
    state: absent

- name: Remove admin tools
  ansible.builtin.apt:
    name: [tmux, lm-sensors, smartmontools, nvme-cli, vainfo, intel-gpu-tools]
    state: absent

- name: Remove user from GPU groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: []
    append: false

- name: Purge the GPU groups (video, render)
  ansible.builtin.group:
    name: "{{ item }}"
    state: absent
  loop: [video, render]
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove ca-certificates (only if no other role needs it)
  ansible.builtin.apt:
    name: ca-certificates
    state: absent
    autoremove: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove apt keyrings directory (if empty)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove python3-debian (only if no other role needs it)
  ansible.builtin.apt:
    name: python3-debian
    state: absent
    autoremove: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove python3-docker (only if no other role needs it)
  ansible.builtin.apt:
    name: python3-docker
    state: absent
    autoremove: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the docker group if present
  ansible.builtin.group:
    name: docker
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the media group if present
  ansible.builtin.group:
    name: media
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"
