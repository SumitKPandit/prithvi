---
- name: Download Tailscale signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /etc/apt/keyrings/tailscale.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/tailscale.gpg
  notify: Refresh apt cache after Tailscale repo

- name: Run pending handlers now
  ansible.builtin.meta: flush_handlers

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Read Tailscale state (login is only needed on a fresh node)
  # Read-only; runs even under --check so the login tasks below can branch.
  ansible.builtin.command: tailscale status --json
  changed_when: false
  check_mode: false
  register: tailscale_state

- name: Log in to Tailscale with the auth key from secrets
  # Idempotent: only runs when the node is not logged in yet. accept-dns=false
  # keeps the server's resolv.conf under systemd-resolved, not MagicDNS.
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ secrets['tailscale_auth_key'] | default('') }}"
      - "--hostname=g3plus"
      - "--accept-dns=false"
  no_log: true
  when:
    - (tailscale_state.stdout | from_json).BackendState != 'Running'
    - secrets['tailscale_auth_key'] | default('') | length > 0

- name: Fail clearly on a fresh node without an auth key
  ansible.builtin.fail:
    msg: >-
      Tailscale is not logged in and tailscale_auth_key is empty in the secrets.
      Fill it with `make secrets-edit`, then re-run. The key is only needed for
      first login; afterwards disable key expiry for g3plus in the admin console.
  when:
    - (tailscale_state.stdout | from_json).BackendState != 'Running'
    - secrets['tailscale_auth_key'] | default('') | length == 0
