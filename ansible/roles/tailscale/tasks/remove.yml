---
# Remove the tailscale role completely.
# Idempotent: running twice is a no-op.
# Brings down tailscaled, removes the package, apt repo and key.
# Does NOT delete the Tailscale node entry from the admin console (manual).

- name: Shut down the tailscale node
  # Bring down first so the node does not linger in the tailnet.
  ansible.builtin.command: tailscale down
  changed_when: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Stop and disable tailscaled
  ansible.builtin.service:
    name: tailscaled
    state: stopped
    enabled: false

- name: Remove the Tailscale GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/tailscale.gpg
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    state: absent
  notify: Refresh apt cache

- name: Remove the Tailscale package (purge)
  ansible.builtin.apt:
    name: tailscale
    state: absent
    purge: true

- name: Autoremove leftover packages
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Remove Tailscale state
  ansible.builtin.file:
    path: /var/lib/tailscale
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove Tailscale log directory
  ansible.builtin.file:
    path: /var/log/tailscale
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"
