---
# Remove the security role completely.
# Idempotent: running twice is a no-op.
# Removes: SSH hardening drop-in, UFW, unattended-upgrades config,
# smartd config, disk-usage push script, DOCKER-USER rules.
# SSH is restored to defaults (key login still works) so the connection is never cut off.

- name: Remove the SSH hardening drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
    state: absent
  notify: Reload sshd

- name: Reload sshd after drop-in removal
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Disable UFW
  community.general.ufw:
    state: disabled

- name: Remove UFW
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true

- name: Remove unattended-upgrades config files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/20auto-upgrades
    - /etc/apt/apt.conf.d/52-security-auto-reboot

- name: Purge unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    purge: true

- name: Remove smartd config
  ansible.builtin.file:
    path: /etc/smartd.conf
    state: absent

- name: Stop and disable smartd
  ansible.builtin.service:
    name: smartd
    state: stopped
    enabled: false

- name: Remove disk-usage push script
  ansible.builtin.file:
    path: /usr/local/bin/disk-usage-push.sh
    state: absent

- name: Remove disk-usage check timer and service
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/disk-usage-check.timer
    - /etc/systemd/system/disk-usage-check.service

- name: Remove kuma push env file
  ansible.builtin.file:
    path: /etc/kuma-push.env
    state: absent
  no_log: true

- name: Remove DOCKER-USER rules script
  ansible.builtin.file:
    path: /usr/local/sbin/docker-user-rules.sh
    state: absent

- name: Remove DOCKER-USER boot unit
  ansible.builtin.file:
    path: /etc/systemd/system/docker-user-rules.service
    state: absent

- name: Flush DOCKER-USER chain
  ansible.builtin.command: iptables -F DOCKER-USER 2>/dev/null || true
  changed_when: false
  failed_when: false
