---
# Hermes agent: 24/7 gateway (OpenRouter + Telegram) with the web dashboard.
# Security posture (see README):
#   - runs as the image's unprivileged internal user, no docker.sock, no host
#     mounts except its own data directory
#   - approvals.mode: manual -> every dangerous command prompts in Telegram
#     and fails closed if no human answers in time
#   - dashboard behind Caddy (hermes.home.sumitkpandit.in) with basic auth
- name: Create the Hermes data directory
  ansible.builtin.file:
    path: "{{ appdata_root }}/hermes"
    state: directory
    owner: media
    group: media
    mode: "0775"
  tags: [hermes]

- name: Create the Hermes stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/hermes"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hermes]

- name: Pre-seed the Hermes config (only if absent)
  # The agent extends this file; hermes config migrations run at container
  # start. Pick the model later with /model in Telegram (README).
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ appdata_root }}/hermes/config.yaml"
    owner: media
    group: media
    mode: "0644"
    force: false
  tags: [hermes]

- name: Render the Hermes .env with the API keys (0600)
  # Read by the agent from /opt/data/.env inside the container.
  ansible.builtin.template:
    src: env.j2
    dest: "{{ appdata_root }}/hermes/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [hermes]

- name: Render the Hermes compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ stacks_root }}/hermes/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  tags: [hermes]

- name: Render the Hermes stack .env (dashboard password; 0600)
  ansible.builtin.template:
    src: stack-env.j2
    dest: "{{ stacks_root }}/hermes/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [hermes]

- name: Deploy the Hermes stack
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/hermes"
    state: present
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [hermes]
