---
# Remove the hermes role completely.
# Idempotent: running twice is a no-op.

- name: Stop and remove the hermes stack
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/hermes"
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove hermes directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ stacks_root }}/hermes"
    - "{{ appdata_root }}/hermes"
