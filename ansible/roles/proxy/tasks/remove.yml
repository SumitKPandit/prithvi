---
# Remove the proxy role completely.
# Stops and removes the Caddy stack, removes the wildcard cert for private services.
# Idempotent: running twice is a no-op.

- name: Stop and remove the proxy stack
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/proxy"
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove proxy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ stacks_root }}/proxy"
    - "{{ appdata_root }}/caddy"
