---
# Caddy reverse proxy for the private services + their DNS records.
# Why Caddy over Traefik: a single readable Caddyfile with a wildcard cert via
# Cloudflare DNS-01, no split static/dynamic config, and the same Dockerfile
# pattern the Caddy docs publish. Traefik would do the same with more files.

- name: Create the Caddy appdata directories
  ansible.builtin.file:
    path: "{{ appdata_root }}/caddy/{{ item }}"
    state: directory
    owner: media
    group: media
    mode: "0775"
  loop: [data, config]
  tags: [proxy]

- name: Create the proxy stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/proxy"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [proxy]

- name: Install the Caddy Dockerfile (caddy + Cloudflare DNS plugin)
  ansible.builtin.copy:
    content: |
      # Builds Caddy with the cloudflare DNS module, per the Caddy docs.
      # Builder and runtime base are pinned to the same Caddy version.
      FROM caddy:{{ caddy_version }}-builder AS builder
      RUN xcaddy build --with github.com/caddy-dns/cloudflare
      FROM caddy:{{ caddy_version }}-alpine
      COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    dest: "{{ stacks_root }}/proxy/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  tags: [proxy]

- name: Render the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ stacks_root }}/proxy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  tags: [proxy, caddy]

- name: Render the proxy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ stacks_root }}/proxy/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  tags: [proxy]

- name: Render the proxy .env (Cloudflare token; 0600 root-only)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/proxy/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [proxy]

- name: Deploy the proxy stack (builds Caddy on first run)
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/proxy"
    state: present
  # --check cannot deploy; see README.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [proxy]

# DNS records for the private hostnames: DNS-only (not proxied) pointing at
# the Tailscale IP. Only run when a Cloudflare token is present; the module
# runs on the Mac (delegate_to) so the token never reaches the server.
- name: Create DNS records for private services
  # record "<name>.home" under zone sumitkpandit.in resolves to
  # <name>.home.sumitkpandit.in.
  community.general.cloudflare_dns:
    api_token: "{{ secrets['cloudflare_api_token'] }}"
    zone: "{{ domain }}"
    record: "{{ item.name }}.home"
    type: A
    value: "{{ tailscale_ip }}"
    proxied: false
    state: present
  delegate_to: localhost
  become: false
  loop: "{{ private_services }}"
  when: secrets['cloudflare_api_token'] | default('') | length > 0
  tags: [proxy, dns]

# Public app hostnames are deliberately NOT managed here: the
# dashboard-managed Cloudflare tunnel creates its own records when you add a
# public hostname, and two owners would fight. See README "Public web apps".
