---
# cloudflared connector for the remotely-managed Cloudflare Tunnel.
# The tunnel config (public hostnames -> services) is done in the Cloudflare
# dashboard; Ansible only runs the connector. See README "Public web apps".
- name: Create the tunnel stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/tunnel"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [tunnel]

- name: Render the tunnel compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ stacks_root }}/tunnel/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  tags: [tunnel]

- name: Render the tunnel .env (tunnel token; 0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/tunnel/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [tunnel]

- name: Deploy the tunnel connector
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/tunnel"
    state: present
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tunnel]
