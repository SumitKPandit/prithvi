---
# Remove the tunnel role completely. Idempotent: running twice is a no-op.
# Does NOT delete the Cloudflare tunnel itself from the dashboard (that's manual).

- name: Stop and remove the tunnel stack
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/tunnel"
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the tunnel stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/tunnel"
    state: absent

- name: Remove tunnel .env file (secrets)
  ansible.builtin.file:
    path: "{{ stacks_root }}/tunnel/.env"
    state: absent
  no_log: true
