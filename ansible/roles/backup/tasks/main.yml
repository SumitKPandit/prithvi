---
# Backups: restic snapshots of everything that cannot be rebuilt from this
# repo (appdata, compose stacks, Dokploy state incl. a live pg_dump), kept
# in a local repo under /opt/backups and mirrored to Google Drive with
# rclone. Media is deliberately excluded: it is re-fetchable via the *arr
# stack, and the NAS role (Phase 6) will give it parity on the pool.
# The whole role is gated on the restic password in the secrets (site.yml).
- name: Install restic, rclone and sqlite3
  # sqlite3 runs the online-backup API against Uptime Kuma's bind-mounted db.
  ansible.builtin.apt:
    name: [restic, rclone, sqlite3]
    state: present
  tags: [backup]

- name: Create the restic repository and dumps directories
  ansible.builtin.file:
    path: "{{ backup_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [restic, dumps]
  tags: [backup]

- name: Store the restic repository password (0600)
  ansible.builtin.copy:
    content: "{{ secrets['restic_repository_password'] }}"
    dest: /etc/restic.pass
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [backup]

- name: Install the dump script
  # Coherent dumps for state that cannot be file-copied while running.
  ansible.builtin.template:
    src: dump.sh.j2
    dest: /usr/local/bin/backup-dump.sh
    owner: root
    group: root
    mode: "0755"
  tags: [backup]

- name: Install the daily backup script
  ansible.builtin.template:
    src: run.sh.j2
    dest: /usr/local/bin/backup-run.sh
    owner: root
    group: root
    mode: "0755"
  tags: [backup]

- name: Install the weekly maintenance script
  ansible.builtin.template:
    src: maintain.sh.j2
    dest: /usr/local/bin/backup-maintain.sh
    owner: root
    group: root
    mode: "0755"
  tags: [backup]

- name: Create the rclone config directory
  ansible.builtin.file:
    path: /etc/rclone
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: secrets['rclone_drive_token'] | default('') | length > 0
  tags: [backup]

- name: Render the rclone config (0600)
  # Written only once the Google Drive token exists in the secrets; the
  # backup scripts detect the file and sync to Drive from then on.
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /etc/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: secrets['rclone_drive_token'] | default('') | length > 0
  tags: [backup]

- name: Remove the rclone config when the token is absent
  # No stale token config if the secret is ever cleared.
  ansible.builtin.file:
    path: /etc/rclone/rclone.conf
    state: absent
  when: secrets['rclone_drive_token'] | default('') | length == 0
  tags: [backup]

- name: Install the backup service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Daily backup (dumps, restic snapshot, rclone to Google Drive)
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      # Dumps query running containers and restic reads all of appdata;
      # keep both off the critical path for the media stack.
      Nice=10
      IOSchedulingClass=idle
      # restic uses $HOME for its cache directory.
      Environment=HOME=/root
      ExecStart=/usr/local/bin/backup-run.sh
    dest: /etc/systemd/system/backup.service
    owner: root
    group: root
    mode: "0644"
  tags: [backup]

- name: Install the backup timer unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Daily backup at 01:30 UTC (07:00 IST)

      [Timer]
      OnCalendar={{ backup_on_calendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/backup.timer
    owner: root
    group: root
    mode: "0644"
  tags: [backup]

- name: Install the maintenance service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Backup maintenance (prune, Drive sync, integrity check, restore drill)
      After=network-online.target

      [Service]
      Type=oneshot
      Nice=10
      IOSchedulingClass=idle
      # restic uses $HOME for its cache directory.
      Environment=HOME=/root
      ExecStart=/usr/local/bin/backup-maintain.sh
    dest: /etc/systemd/system/backup-maintenance.service
    owner: root
    group: root
    mode: "0644"
  tags: [backup]

- name: Install the maintenance timer unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Weekly backup maintenance, Sundays 03:30 UTC (09:00 IST)

      [Timer]
      OnCalendar={{ backup_maintenance_on_calendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/backup-maintenance.timer
    owner: root
    group: root
    mode: "0644"
  tags: [backup]

- name: Enable the backup timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: [backup.timer, backup-maintenance.timer]
  # --check cannot create the unit files first (check-mode limitations)
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [backup]
