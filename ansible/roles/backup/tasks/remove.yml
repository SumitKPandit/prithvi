---
# Remove the backup role completely. Idempotent: running twice is a no-op.
# Does NOT delete the Google Drive backups or the restic repository password
# from SOPS. The local restic repo under /opt/backups/restic is removed.

- name: Stop and disable backup timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop:
    - backup.timer
    - backup-maintenance.timer
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove backup timer and service units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/backup.timer
    - /etc/systemd/system/backup.service
    - /etc/systemd/system/backup-maintenance.timer
    - /etc/systemd/system/backup-maintenance.service

- name: Remove backup scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/backup-run.sh
    - /usr/local/bin/backup-dump.sh
    - /usr/local/bin/backup-maintain.sh

- name: Remove rclone config
  ansible.builtin.file:
    path: /etc/rclone/rclone.conf
    state: absent

- name: Remove restic password file
  ansible.builtin.file:
    path: /etc/restic.pass
    state: absent

- name: Remove local restic repository
  ansible.builtin.file:
    path: "{{ backup_root }}/restic"
    state: absent

- name: Remove backup dump directory
  ansible.builtin.file:
    path: "{{ backup_root }}/dumps"
    state: absent

- name: Remove kuma push env (shared with security role)
  ansible.builtin.file:
    path: /etc/kuma-push.env
    state: absent

- name: Remove backup root if empty
  ansible.builtin.file:
    path: "{{ backup_root }}"
    state: absent
