---
# Remove the NAS role. Idempotent: running twice is a no-op.
# Unmounts the pool FIRST (it overlays the disks), then the disks, removes
# the snapraid config and timers. Never formats or wipes any disk; the data
# on the disks is left exactly where the pool showed it.
- name: Stop and disable the SnapRAID timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop: [snapraid-sync.timer, snapraid-scrub.timer]
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the SnapRAID units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/snapraid-sync.timer
    - /etc/systemd/system/snapraid-sync.service
    - /etc/systemd/system/snapraid-scrub.timer
    - /etc/systemd/system/snapraid-scrub.service

- name: Unmount the mergerfs pool
  ansible.posix.mount:
    path: "{{ nas_pool_mount }}"
    state: absent

- name: Unmount the data and parity disks
  ansible.posix.mount:
    path: "{{ item.mount }}"
    state: absent
  loop: "{{ nas_data_disks + nas_parity_disks }}"

- name: Remove snapraid.conf
  ansible.builtin.file:
    path: /etc/snapraid.conf
    state: absent
