---
# Section 0: facts and prerequisites
- name: Discover the host render group GID (Jellyfin group_add needs it, never hardcode)
  # Read-only; runs even under --check so the compose template can use it.
  ansible.builtin.command: getent group render
  changed_when: false
  check_mode: false
  register: render_group
  failed_when: render_group.rc != 0

- name: Store the render GID
  ansible.builtin.set_fact:
    render_gid: "{{ render_group.stdout.split(':')[2] }}"

- name: Require VPN credentials when the VPN is enabled
  ansible.builtin.assert:
    that:
      - secrets['vpn_provider'] | default('') | length > 0
      - secrets['vpn_username'] | default('') | length > 0
      - secrets['vpn_password'] | default('') | length > 0
    fail_msg: >-
      vpn_enabled is true but vpn_provider/vpn_username/vpn_password are empty
      in the secrets. Fill them (make secrets-edit) or set vpn_enabled: false.
  when: vpn_enabled | bool
  tags: [media]

- name: Create appdata directories for each media service
  ansible.builtin.file:
    path: "{{ appdata_root }}/{{ item }}"
    state: directory
    owner: media
    group: media
    mode: "0775"
  loop:
    - qbittorrent
    - sonarr
    - radarr
    - prowlarr
    - bazarr
    - jellyseerr
    - jellyfin
    # flaresolverr was excluded before, leaving the dir root:root (F-34).
    - flaresolverr
  tags: [media]

- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/media"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [media]

# Section 1: pre-seed configs before first start. force=false everywhere:
# once the app owns its config, Ansible never touches it again.
- name: Check for an existing qBittorrent config
  ansible.builtin.stat:
    path: "{{ appdata_root }}/qbittorrent/qBittorrent.conf"
  register: qbit_conf

- name: Compute the qBittorrent WebUI password hash
  # Format verified against qBittorrent's source (src/base/utils/password.cpp):
  # PBKDF2-HMAC-SHA512, 100k iterations, 16-byte salt, 64-byte key,
  # stored as base64(salt):base64(key) inside @ByteArray(...).
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, hashlib, os
        pw = os.environ['QBIT_PW']
        salt = os.urandom(16)
        key = hashlib.pbkdf2_hmac('sha512', pw.encode(), salt, 100000, 64)
        print(base64.b64encode(salt).decode() + ':' + base64.b64encode(key).decode())
  environment:
    QBIT_PW: "{{ secrets['internal_qbittorrent_admin_password'] | default('') }}"
  no_log: true
  register: qbit_hash
  changed_when: false
  when: not qbit_conf.stat.exists

- name: Set the qBittorrent password hash fact
  ansible.builtin.set_fact:
    qbittorrent_password_hash: "{{ qbit_hash.stdout }}"
  no_log: true
  when: not qbit_conf.stat.exists

- name: Pre-seed the qBittorrent config (only if absent)
  ansible.builtin.template:
    src: qbittorrent.conf.j2
    dest: "{{ appdata_root }}/qbittorrent/qBittorrent.conf"
    owner: media
    group: media
    mode: "0640"
    force: false
  # Template vars (the hash) only exist when creating; skip when it exists.
  when: not qbit_conf.stat.exists

- name: Pre-seed Arr API keys into config.xml (only if absent)
  # Fresh builds: the apps adopt these keys on first start. This server's apps
  # already generated their own keys, which were adopted into the secrets.
  # Bazarr is not here: its API key lives in config/config.yaml, not config.xml.
  ansible.builtin.template:
    src: config.xml.j2
    dest: "{{ appdata_root }}/{{ item.name }}/config.xml"
    owner: media
    group: media
    mode: "0640"
    force: false
  loop:
    - name: sonarr
      key: "{{ secrets['internal_sonarr_api_key'] | default('') }}"
    - name: radarr
      key: "{{ secrets['internal_radarr_api_key'] | default('') }}"
    - name: prowlarr
      key: "{{ secrets['internal_prowlarr_api_key'] | default('') }}"
  no_log: true

# Section 2: render and deploy the stack
- name: Render the media compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ stacks_root }}/media/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render the media .env (VPN credentials; 0600 root-only)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/media/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy the media stack
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/media"
    state: present
  # --check cannot deploy (the rendered files do not exist yet); see README.
  ignore_errors: "{{ ansible_check_mode }}"

# Config files under /opt/appdata hold API keys, hashes and session cookies;
# the images default to world-readable (UMASK=027 above stops new files), so
# strip the world bits from what already exists. qBittorrent rewrites its own
# config on exit, so the UMASK line is what keeps it sticky going forward.
- name: Strip world access from appdata files and directories
  ansible.builtin.shell: >-
    find {{ appdata_root }} -type f -perm -o=r -print -exec chmod o-r {} +;
    find {{ appdata_root }} -type d -perm -o=x -print -exec chmod o-x {} +
  changed_when: "appdata_chmod.stdout | length > 0"
  register: appdata_chmod
  tags: [media]

# Section 3+4: wait for the APIs, then wire the apps together. Skipped in
# --check because nothing is actually deployed then.
- name: Wire the media apps together through their APIs
  when: not ansible_check_mode
  block:
    # One wait task per service (until does not work well with loops: the
    # registered loop result has no top-level status to compare against).
    - name: Wait for the Sonarr API to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/system/status"
        headers: { X-Api-Key: "{{ secrets['internal_sonarr_api_key'] | default('') }}" }
        status_code: 200
      register: sonarr_ready
      until: sonarr_ready.status == 200
      retries: 60
      delay: 5
      changed_when: false
      no_log: true

    - name: Wait for the Radarr API to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ radarr_port }}/api/v3/system/status"
        headers: { X-Api-Key: "{{ secrets['internal_radarr_api_key'] | default('') }}" }
        status_code: 200
      register: radarr_ready
      until: radarr_ready.status == 200
      retries: 60
      delay: 5
      changed_when: false
      no_log: true

    - name: Wait for the Prowlarr API to answer
      # Prowlarr's API is v1, unlike Sonarr/Radarr's v3.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prowlarr_port }}/api/v1/system/status"
        headers: { X-Api-Key: "{{ secrets['internal_prowlarr_api_key'] | default('') }}" }
        status_code: 200
      register: prowlarr_ready
      until: prowlarr_ready.status == 200
      retries: 60
      delay: 5
      changed_when: false
      no_log: true

    # Every wiring task is check-then-create, so reruns report changed=0.
    - name: Read Sonarr root folders
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/rootfolder"
        headers: { X-Api-Key: "{{ secrets['internal_sonarr_api_key'] | default('') }}" }
      register: sonarr_roots
      changed_when: false
      no_log: true

    - name: Add the TV root folder to Sonarr
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/rootfolder"
        headers: { X-Api-Key: "{{ secrets['internal_sonarr_api_key'] | default('') }}" }
        method: POST
        body_format: json
        body:
          path: "{{ data_root }}/media/tv"
        status_code: 201
      when: sonarr_roots.json | selectattr('path', 'equalto', data_root ~ '/media/tv') | list | length == 0
      no_log: true

    - name: Read Radarr root folders
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ radarr_port }}/api/v3/rootfolder"
        headers: { X-Api-Key: "{{ secrets['internal_radarr_api_key'] | default('') }}" }
      register: radarr_roots
      changed_when: false
      no_log: true

    - name: Add the movies root folder to Radarr
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ radarr_port }}/api/v3/rootfolder"
        headers: { X-Api-Key: "{{ secrets['internal_radarr_api_key'] | default('') }}" }
        method: POST
        body_format: json
        body:
          path: "{{ data_root }}/media/movies"
        status_code: 201
      when: radarr_roots.json | selectattr('path', 'equalto', data_root ~ '/media/movies') | list | length == 0
      no_log: true

    - name: Read Sonarr download clients
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/downloadclient"
        headers: { X-Api-Key: "{{ secrets['internal_sonarr_api_key'] | default('') }}" }
      register: sonarr_clients
      changed_when: false
      no_log: true

    - name: Add qBittorrent as Sonarr download client
      # When the VPN is on, qBittorrent shares gluetun's network namespace,
      # so its hostname changes from "qbittorrent" to "gluetun".
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/downloadclient"
        headers: { X-Api-Key: "{{ secrets['internal_sonarr_api_key'] | default('') }}" }
        method: POST
        body_format: json
        body:
          enable: true
          name: qBittorrent
          implementation: QBittorrent
          configContract: QBittorrentSettings
          priority: 1
          fields:
            - { order: 0, name: host, value: "{{ 'gluetun' if vpn_enabled else 'qbittorrent' }}" }
            - { order: 1, name: port, value: "{{ qbittorrent_webui_port | int }}" }
            - { order: 2, name: username, value: admin }
            - { order: 3, name: password, value: "{{ secrets['internal_qbittorrent_admin_password'] | default('') }}" }
        status_code: 201
      when: sonarr_clients.json | selectattr('name', 'equalto', 'qBittorrent') | list | length == 0
      no_log: true

    - name: Read Radarr download clients
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ radarr_port }}/api/v3/downloadclient"
        headers: { X-Api-Key: "{{ secrets['internal_radarr_api_key'] | default('') }}" }
      register: radarr_clients
      changed_when: false
      no_log: true

    - name: Add qBittorrent as Radarr download client
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ radarr_port }}/api/v3/downloadclient"
        headers: { X-Api-Key: "{{ secrets['internal_radarr_api_key'] | default('') }}" }
        method: POST
        body_format: json
        body:
          enable: true
          name: qBittorrent
          implementation: QBittorrent
          configContract: QBittorrentSettings
          priority: 1
          fields:
            - { order: 0, name: host, value: "{{ 'gluetun' if vpn_enabled else 'qbittorrent' }}" }
            - { order: 1, name: port, value: "{{ qbittorrent_webui_port | int }}" }
            - { order: 2, name: username, value: admin }
            - { order: 3, name: password, value: "{{ secrets['internal_qbittorrent_admin_password'] | default('') }}" }
        status_code: 201
      when: radarr_clients.json | selectattr('name', 'equalto', 'qBittorrent') | list | length == 0
      no_log: true

    - name: Read Prowlarr applications
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prowlarr_port }}/api/v1/applications"
        headers: { X-Api-Key: "{{ secrets['internal_prowlarr_api_key'] | default('') }}" }
      register: prowlarr_apps
      changed_when: false
      no_log: true

    # Prowlarr pushes indexers into Sonarr/Radarr, so the connection is wired
    # on Prowlarr's side ("Applications"), not in the *arrs themselves.
    - name: Add Sonarr and Radarr as Prowlarr applications
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prowlarr_port }}/api/v1/applications"
        headers: { X-Api-Key: "{{ secrets['internal_prowlarr_api_key'] | default('') }}" }
        method: POST
        body_format: json
        body:
          name: "{{ item.name }}"
          implementation: "{{ item.implementation }}"
          configContract: "{{ item.implementation }}Settings"
          syncLevel: fullSync
          fields:
            - { order: 0, name: prowlarrUrl, value: "http://prowlarr:9696" }
            - { order: 1, name: baseUrl, value: "http://{{ item.host }}:{{ item.port }}" }
            - { order: 2, name: apiKey, value: "{{ item.key }}" }
        status_code: 201
      loop:
        - name: Sonarr
          implementation: Sonarr
          host: sonarr
          port: 8989
          key: "{{ secrets['internal_sonarr_api_key'] | default('') }}"
        - name: Radarr
          implementation: Radarr
          host: radarr
          port: 7878
          key: "{{ secrets['internal_radarr_api_key'] | default('') }}"
      when: prowlarr_apps.json | selectattr('name', 'equalto', item.name) | list | length == 0
      no_log: true

    # Jellyfin: first-run wizard, libraries, stream limit, Quick Sync.
    # Gated on jellyfin_admin_password; without it the wizard stays manual
    # (short manual list in the README).
    - name: Wait for the Jellyfin API to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/System/Info/Public"
        status_code: 200
      register: jellyfin_ready
      until: jellyfin_ready.status == 200
      retries: 60
      delay: 5
      changed_when: false

    - name: Read Jellyfin startup configuration
      # 200 while the first-run wizard is open; 401 once it is completed.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Startup/Configuration"
        status_code: [200, 401]
      register: jellyfin_startup
      changed_when: false
      when: secrets['jellyfin_admin_password'] | default('') | length > 0

    - name: Create the Jellyfin admin user and finish the wizard
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Startup/User"
        method: POST
        body_format: json
        body:
          Username: "{{ secrets['jellyfin_admin_username'] | default('sumit') }}"
          Password: "{{ secrets['jellyfin_admin_password'] | default('') }}"
        status_code: 204
      when: jellyfin_startup.status is defined and jellyfin_startup.status == 200
      no_log: true

    - name: Complete the Jellyfin wizard
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Startup/Complete"
        method: POST
        status_code: 204
      when: jellyfin_startup.status is defined and jellyfin_startup.status == 200

    - name: Authenticate to Jellyfin as the admin
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Users/AuthenticateByName"
        method: POST
        body_format: json
        body:
          Username: "{{ secrets['jellyfin_admin_username'] | default('sumit') }}"
          Pw: "{{ secrets['jellyfin_admin_password'] | default('') }}"
        status_code: 200
      register: jellyfin_auth
      changed_when: false
      when: secrets['jellyfin_admin_password'] | default('') | length > 0
      no_log: true

    - name: Read Jellyfin users
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Users"
        headers: { X-Emby-Token: "{{ jellyfin_auth.json.AccessToken }}" }
      register: jellyfin_users
      changed_when: false
      when: secrets['jellyfin_admin_password'] | default('') | length > 0
      no_log: true

    - name: Cap every Jellyfin user at 2 simultaneous streams
      # Jellyfin has no global cap; MaxActiveSessions is per user. See the
      # README for what this enforces vs. what stays advisory.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Users/{{ item.Id }}/Policy"
        headers: { X-Emby-Token: "{{ jellyfin_auth.json.AccessToken }}" }
        method: POST
        body_format: json
        body: "{{ item.Policy | combine({'MaxActiveSessions': jellyfin_max_sessions}) }}"
        status_code: 204
      loop: "{{ jellyfin_users.json }}"
      loop_control: { label: "{{ item.Name }}" }
      when:
        - secrets['jellyfin_admin_password'] | default('') | length > 0
        - item.Policy.MaxActiveSessions != jellyfin_max_sessions
      no_log: true

    - name: Read Jellyfin libraries
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/Library/VirtualFolders"
        headers: { X-Emby-Token: "{{ jellyfin_auth.json.AccessToken }}" }
      register: jellyfin_libs
      changed_when: false
      when: secrets['jellyfin_admin_password'] | default('') | length > 0
      no_log: true

    - name: Create the Jellyfin libraries
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ jellyfin_port }}/Library/VirtualFolders
          ?name={{ item.name }}&collectionType={{ item.type }}&paths={{ item.path }}&refresh=true
        headers: { X-Emby-Token: "{{ jellyfin_auth.json.AccessToken }}" }
        method: POST
        body_format: json
        body: {}
        status_code: 204
      loop:
        - { name: Movies, type: movies, path: "{{ data_root }}/media/movies" }
        - { name: "TV Shows", type: tvshows, path: "{{ data_root }}/media/tv" }
      when:
        - secrets['jellyfin_admin_password'] | default('') | length > 0
        - jellyfin_libs.json | selectattr('Name', 'equalto', item.name) | list | length == 0
      no_log: true

    - name: Read Jellyfin encoding settings
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/System/Configuration/Encoding"
        headers: { X-Emby-Token: "{{ jellyfin_auth.json.AccessToken }}" }
      register: jellyfin_encoding
      changed_when: false
      when: secrets['jellyfin_admin_password'] | default('') | length > 0
      no_log: true

    - name: Enable Quick Sync hardware transcoding
      # N150: H.264/HEVC 8+10-bit and VP9 encode+decode, AV1 decode only.
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/System/Configuration/Encoding"
        headers: { X-Emby-Token: "{{ jellyfin_auth.json.AccessToken }}" }
        method: POST
        body_format: json
        body: >-
          {{ jellyfin_encoding.json |
             combine({'HardwareAccelerationType': 'qsv', 'EnableHardwareEncoding': true}) }}
        status_code: 204
      when:
        - secrets['jellyfin_admin_password'] | default('') | length > 0
        - jellyfin_encoding.json.HardwareAccelerationType != 'qsv'
      no_log: true
