---
# Remove the media role completely.
# Stops and removes all media stack containers, removes config directories,
# removes the media group/user. Does NOT remove /data user data.

- name: Stop and remove the qbittorrent container (with gluetun if VPN was on)
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_root }}/media"
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove qbittorrent config directory
  ansible.builtin.file:
    path: "{{ appdata_root }}/qbittorrent"
    state: absent
  no_log: true
  when: teardown_data | default(false) | bool
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove other media config directories
  ansible.builtin.file:
    path: "{{ appdata_root }}/{{ item }}"
    state: absent
  loop:
    - sonarr
    - radarr
    - prowlarr
    - bazarr
    - jellyseerr
    - flaresolverr
    - jellyfin
    - recyclarr
  when: teardown_data | default(false) | bool

- name: Remove the media stack directory
  ansible.builtin.file:
    path: "{{ stacks_root }}/media"
    state: absent

- name: Remove the media group
  ansible.builtin.group:
    name: media
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the media user
  ansible.builtin.user:
    name: media
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the docker web network (shared, only if no other containers reference it)
  # Note: this network may be used by other stacks (proxy dashboards). Removing it
  # may break other services. Leave it in place by default; use --force if needed.
  community.docker.docker_network:
    name: web
    state: absent
  failed_when: false
