---
- name: Create the media group and user (fixed IDs, one identity for all media containers)
  ansible.builtin.group:
    name: media
    gid: "{{ media_gid }}"
  tags: [storage]

- name: Create the media user
  ansible.builtin.user:
    name: media
    uid: "{{ media_uid }}"
    group: media
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [storage]

- name: Create the data root
  ansible.builtin.file:
    path: "{{ data_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [storage]

- name: Create torrents and media directories
  # Same filesystem as the media library so Sonarr/Radarr can hardlink or
  # atomically move completed downloads. Group-writable (0775) because
  # qBittorrent (writer) and Jellyfin (reader) share the media group.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: media
    group: media
    mode: "0775"
  loop:
    - "{{ data_root }}/torrents/movies"
    - "{{ data_root }}/torrents/tv"
    - "{{ data_root }}/media/movies"
    - "{{ data_root }}/media/tv"
  tags: [storage]

- name: Create the appdata root (container config volumes)
  ansible.builtin.file:
    path: "{{ appdata_root }}"
    state: directory
    owner: media
    group: media
    mode: "0775"
  tags: [storage]

- name: Create the stacks root (compose files + rendered env)
  ansible.builtin.file:
    path: "{{ stacks_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [storage]

- name: Create the shared docker network for private services
  # Caddy, the dashboards and monitoring all attach here, so reverse-proxying
  # by container name works across stacks.
  community.docker.docker_network:
    name: web
    driver: bridge
    state: present
  tags: [storage]
