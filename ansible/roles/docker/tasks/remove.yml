---
# Remove the docker role completely.
# Idempotent: running twice is a no-op.
# Removes: Docker apt repository + key, all Docker packages,
# daemon config, docker group, prune timer, DOCKER-USER rules, sysctl.

- name: Stop and disable Docker
  ansible.builtin.service:
    name: docker
    state: stopped
    enabled: false

- name: Stop and disable containerd
  ansible.builtin.service:
    name: containerd
    state: stopped
    enabled: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the prune timer and service
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/docker-prune.timer
    - /etc/systemd/system/docker-prune.service

- name: Disable the DOCKER-USER boot unit
  ansible.builtin.systemd:
    name: docker-user-rules.service
    enabled: false
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the DOCKER-USER boot unit
  ansible.builtin.file:
    path: /etc/systemd/system/docker-user-rules.service
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the DOCKER-USER rules script
  ansible.builtin.file:
    path: /usr/local/sbin/docker-user-rules.sh
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Flush the DOCKER-USER chain
  ansible.builtin.command: iptables -F DOCKER-USER 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: Remove the Docker daemon config
  ansible.builtin.file:
    path: /etc/docker/daemon.json
    state: absent

- name: Remove the Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    state: absent
  notify: Refresh apt cache

- name: Remove Docker packages (purge)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
    purge: true

- name: Autoremove leftover packages
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Remove the docker group
  ansible.builtin.group:
    name: docker
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove published-port sysctl override
  ansible.builtin.file:
    path: /etc/sysctl.d/99-docker-nonlocal-bind.conf
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"
