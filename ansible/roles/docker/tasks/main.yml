---
- name: Get Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  notify: Refresh apt cache

- name: Run pending handlers now (apt must refresh before installing packages)
  ansible.builtin.meta: flush_handlers

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Configure the Docker daemon (container log rotation)
  # No live-restore: Docker documents that it only applies to standalone
  # containers, not Swarm services, and Dokploy needs Swarm mode.
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file=%s
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow Docker to bind published ports before the LAN/Tailscale IP exists
  # Containers publish on 192.168.0.2 / 100.88.141.33. At boot Docker may start
  # before Wi-Fi or tailscaled has the address; without this the port bind
  # fails and the container stays down (e.g. after the 03:00 auto-reboot).
  # The file must live in /etc/sysctl.d: modern systemd never reads the
  # legacy /etc/sysctl.conf directly.
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-docker-nonlocal-bind.conf

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Weekly timer to remove dangling Docker images
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Weekly removal of dangling Docker images

      [Timer]
      OnCalendar=Sun *-*-* 04:30:00
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/docker-prune.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd units

- name: Service unit for the prune timer
  # Deliberately `image prune` (dangling only), never `system prune`: that
  # would also delete intentionally stopped containers. Volumes are untouched.
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Remove dangling Docker images
      Wants=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune -f
    dest: /etc/systemd/system/docker-prune.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd units

- name: Enable the prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    state: started
    enabled: true
    daemon_reload: true
  # --check cannot create unit files (README: check-mode limitations)
  ignore_errors: "{{ ansible_check_mode }}"
