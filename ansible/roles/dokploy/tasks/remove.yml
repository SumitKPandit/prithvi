---
# Remove the dokploy role completely.
# Reverses the single-node Docker Swarm init and removes Dokploy containers.
# Idempotent: running twice has no effect.

- name: Read Docker swarm state
  ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.NodeID{{ "}}" }}'
  changed_when: false
  register: swarm_state
  ignore_errors: "{{ ansible_check_mode }}"

- name: Leave the single-node Docker Swarm (if initialized)
  ansible.builtin.command: docker swarm leave --force
  when: swarm_state.rc == 0
  changed_when: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove dokploy-traefik container
  ansible.builtin.command: docker rm -f dokploy-traefik
  changed_when: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove attachable overlay network
  community.docker.docker_network:
    name: dokploy-network
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove dokploy-traefik config directory
  ansible.builtin.file:
    path: /etc/dokploy/traefik
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove dokploy network config
  ansible.builtin.file:
    path: /etc/dokploy/network
    state: absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: List Dokploy named volumes
  ansible.builtin.command: docker volume ls -q -f name=dokploy
  changed_when: false
  failed_when: false
  ignore_errors: "{{ ansible_check_mode }}"
  register: docker_volumes

- name: Remove Dokploy named volumes (data loss)
  # Dokploy's state lives in named volumes (dokploy-postgres, ...); removed
  # only when the operator explicitly asks for data deletion.
  ansible.builtin.command: docker volume rm -f {{ item }}
  loop: "{{ docker_volumes.stdout_lines | default([]) }}"
  when: teardown_data | default(false) | bool
  changed_when: true
  failed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the remaining Dokploy config directory (data loss)
  ansible.builtin.file:
    path: /etc/dokploy
    state: absent
  when: teardown_data | default(false) | bool
  ignore_errors: "{{ ansible_check_mode }}"
