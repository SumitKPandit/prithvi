---
- name: Firewall | allow SSH from LAN (so UFW can't lock you out)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ lan_subnet }}"

- name: Firewall | allow SSH from Tailscale
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ tailscale_range }}"

- name: Firewall | allow HTTP/HTTPS on LAN (Traefik)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: "{{ lan_subnet }}"
  loop:
    - "80"
    - "443"

- name: Firewall | allow DNS (AdGuard) on LAN
  community.general.ufw:
    rule: allow
    port: "53"
    from_ip: "{{ lan_subnet }}"

- name: Firewall | allow qBittorrent torrent port
  community.general.ufw:
    rule: allow
    port: "6881"
    proto: tcp
    from_ip: "{{ lan_subnet }}"

- name: Firewall | allow qBittorrent torrent port UDP
  community.general.ufw:
    rule: allow
    port: "6881"
    proto: udp
    from_ip: "{{ lan_subnet }}"

- name: Firewall | enable UFW (deny incoming, allow outgoing)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
