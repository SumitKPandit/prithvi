---
# Addresses of the server (verify.yml asserts the Tailscale IP is real)
lan_ip: "192.168.0.2"
lan_cidr: "192.168.0.0/24"
tailscale_ip: "100.88.141.33"

# Hostnames: private services <name>.home.sumitkpandit.in (Tailscale/LAN only),
# public web apps <app>.sumitkpandit.in (via the Cloudflare Tunnel)
domain: "sumitkpandit.in"
private_host_suffix: "home.sumitkpandit.in"

# Host clock is UTC; containers that care run on IST
container_timezone: "Asia/Kolkata"

# Data layout. Changing data_root to /mnt/pool later (NAS role) moves media
# without touching any compose file, because every container mounts from here.
data_root: "/data"
appdata_root: "/opt/appdata"
stacks_root: "/opt/stacks"

# One UID/GID for all media containers (hardlinks need identical ownership)
media_uid: 2000
media_gid: 2000

# Disk usage that triggers an alert (percent of /)
disk_alert_pct: 85

# Feature toggles
vpn_enabled: false
nas_enabled: false
dokploy_enabled: true

# Private services: one list drives Caddy routes, DNS records and the
# Homepage dashboard, so they can never drift apart.
# host/port = container name + port on the shared 'web' network.
private_services:
  - { name: jellyfin, host: jellyfin, port: 8096, desc: Media server }
  - { name: sonarr, host: sonarr, port: 8989, desc: TV automation }
  - { name: radarr, host: radarr, port: 7878, desc: Movie automation }
  - { name: prowlarr, host: prowlarr, port: 9696, desc: Indexer management }
  - { name: bazarr, host: bazarr, port: 6767, desc: Subtitles }
  - { name: jellyseerr, host: jellyseerr, port: 5055, desc: Requests }
  - { name: qbittorrent, host: qbittorrent, port: 8080, desc: Downloads }
  - { name: uptime, host: uptime-kuma, port: 3001, desc: Monitoring }
  - { name: dockge, host: dockge, port: 5001, desc: Compose stacks }
  - { name: homepage, host: homepage, port: 3000, desc: Dashboard }

# Email for Let's Encrypt certificate notices (optional but recommended).
# TODO: set your email address.
acme_email: ""
