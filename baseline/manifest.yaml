# Baseline manifest: where baseline/* came from and how to refresh it.
# The data files are committed from a GENUINELY FRESH Ubuntu 26.04 install,
# never from the provisioned g3plus (see README "verify-clean").
#
# PLACEHOLDER: no baseline has been captured yet. To capture one:
#   1. On the Mac, install UTM and an x86_64 Ubuntu Server 26.04 image
#      (g3plus is x86_64; ARM package lists differ). Do a minimal install,
#      enable SSH, note the VM's IP.
#   2. From the repo root:
#        BASELINE_DIR=baseline sh scripts/capture-baseline.sh user@<vm-ip>
#   3. Fill in the fields below (os, kernel, arch, captured_at, method,
#      source = "utm-throwaway-vm"), review the diff hunks for secrets
#      (there should be none), then:
#        git add baseline && git commit -m "baseline: fresh Ubuntu 26.04 state"
#   4. Run `make verify-clean` against g3plus: every FAIL is real drift.

